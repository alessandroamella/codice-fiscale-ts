name: Update Municipalities

on:
  # Run on schedule (every Monday at 3 AM UTC)
  schedule:
    - cron: "0 3 * * 1"

  # Allow manual triggering
  workflow_dispatch:

jobs:
  update-municipalities:
    name: Check for municipality updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC) + provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Run update script
        id: update
        # The script exits 1 when the data changed: don't let `bash -e` abort
        # the step before the exit code is recorded
        run: |
          set +e
          pnpm run update-municipalities
          code=$?
          echo "update_exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi

      - name: Commit changes if municipalities were updated
        if: steps.update.outputs.update_exit_code == '1'
        run: pnpm run commit-municipalities-update

      - name: Push changes
        if: steps.update.outputs.update_exit_code == '1'
        run: git push

      - name: Release
        if: steps.update.outputs.update_exit_code == '1'
        run: |
          pnpm run build
          pnpm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
