name: Update Municipalities

on:
  # Run on schedule (every Monday at 3 AM UTC)
  schedule:
    - cron: "0 3 * * 1"

  # Allow manual triggering
  workflow_dispatch:

jobs:
  update-municipalities:
    name: Check for municipality updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to dispatch the release workflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run update script
        id: update
        # The script exits 1 when the data changed: don't let `bash -e` abort
        # the step before the exit code is recorded
        run: |
          set +e
          bun run update-municipalities
          code=$?
          echo "update_exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi

      - name: Commit changes if municipalities were updated
        if: steps.update.outputs.update_exit_code == '1'
        run: |
          bun test
          bun run commit-municipalities-update

      - name: Push changes
        if: steps.update.outputs.update_exit_code == '1'
        run: git push

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so dispatch the
      # main one explicitly: it checks, builds and releases the new data
      - name: Trigger release
        if: steps.update.outputs.update_exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run codice-fiscale-ts.yml --ref "${{ github.ref_name }}"
