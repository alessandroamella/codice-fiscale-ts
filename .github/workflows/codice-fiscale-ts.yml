name: codice-fiscale-ts

on:
  push:
    branches:
      - main
      - master
      - next
      - beta
      - alpha
  pull_request:
    branches:
      - main
      - master
  # Dispatched by update-municipalities.yml after pushing new data, so that
  # every release goes through this workflow (the npm trusted publisher)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  check:
    name: 🔬 Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: 🔬 Lint
        run: bun run lint
      - name: ʦ Typecheck
        run: bun run type:check
      - name: ⚡ Tests
        run: bun run test:coverage
      - name: 🔨 Build
        run: bun run build

  release:
    name: 🚀 Build & release
    if: github.event_name != 'pull_request'
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # semantic-release and npm (for trusted publishing) run on Node
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: 🔨 Build
        run: bun run build
      - name: 🚀 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run semantic-release
