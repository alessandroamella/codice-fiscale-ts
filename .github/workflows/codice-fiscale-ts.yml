name: codice-fiscale-ts

on:
  push:
    branches:
      - main
      - master
      - next
      - beta
      - alpha
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  lint:
    name: 🔬 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - name: 🔬 Lint
        run: pnpm run lint

  type-check:
    name: ʦ Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - name: ʦ Typecheck
        run: pnpm run type:check

  test:
    name: ⚡ Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - name: ⚡ Tests
        run: pnpm run test:coverage

  build-and-release:
    name: 🚀 Build & release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/next' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/alpha')
    needs: [lint, type-check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - name: 🔨 Build
        run: pnpm run build
      - name: 🚀 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run semantic-release
